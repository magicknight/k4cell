name: Check proposed site changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- site
      - run: node scripts/verify-determinism.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/k4cell-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          python tests/browser_check.py
